
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYC Taxi Tour</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:18px 12px}
h1{margin:4px;font-size:clamp(24px,5vw,40px)}
p{color:#d9e5f5}
#screen{position:relative;max-width:1000px;margin:auto;height: min(58vw,480px);min-height:300px;overflow:hidden;background:linear-gradient(#75b9e9 0%,#d5e9f5 65%,#555 65%,#252a33 100%)}
#sun{position:absolute;top:35px;right:12%;width:65px;height:65px;border-radius:50%;background:#ffe8a3}
#buildings{position:absolute;bottom:35%;left:0;width:100%;height:50%;display:flex;align-items:end;justify-content:space-around}
.building{width:12%;background:#536477;border:3px solid #35475b;position:relative}
.building:before{content:"";position:absolute;inset:12px 8px;background:repeating-linear-gradient(90deg,#f8d98c 0 7px,transparent 7px 17px),repeating-linear-gradient(0deg,transparent 0 17px,#35475b 17px 21px)}
.b1{height:65%}.b2{height:90%;width:15%}.b3{height:75%}.b4{height:100%;width:10%}.b5{height:60%}
#landmark{position:absolute;bottom:37%;left:50%;transform:translateX(-50%);font-size:clamp(34px,8vw,76px);text-shadow:0 3px 5px #222}
#road{position:absolute;bottom:0;width:100%;height:36%;background:#343941}
#road:after{content:"";position:absolute;top:48%;left:0;width:100%;border-top:5px dashed #eee}
#hood{position:absolute;bottom:-5%;left:50%;transform:translateX(-50%);width:75%;height:32%;background:#f5c928;border:7px solid #d69e13;border-radius:50% 50% 0 0;box-shadow:0 -8px 20px #222}
#hood:after{content:"NYC TAXI";position:absolute;top:38%;left:0;width:100%;font-weight:bold;font-size:clamp(20px,4vw,36px);color:#252525;letter-spacing:5px}
#caption{font-size:22px;font-weight:bold;margin:18px 10px 6px}
#sub{max-width:700px;margin:0 auto;padding:0 15px;min-height:48px;line-height:1.5}
.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:18px}
button{border:0;border-radius:25px;padding:13px 22px;font-size:16px;font-weight:bold;background:#f5c928;color:#171717;cursor:pointer}
button.secondary{background:#fff}
#status{color:#b8c9dc;font-size:13px;padding-bottom:20px}
</style>
</head>
<body>
<header>
<h1>🚕 New York City Taxi Tour</h1>
<p>A ride through the city that never sleeps</p>
</header>
<div id="screen">
<div id="sun"></div>
<div id="buildings">
<div class="building b1"></div><div class="building b2"></div>
<div class="building b3"></div><div class="building b4"></div>
<div class="building b5"></div>
</div>
<div id="landmark">🌆</div>
<div id="road"></div>
<div id="hood"></div>
</div>
<div id="caption">Welcome to New York!</div>
<div id="sub">Our journey through the Big Apple is about to begin. Fasten your seatbelt!</div>
<div class="controls">
<button class="secondary" onclick="previous()">← Previous</button>
<button onclick="next()">Next stop →</button>
<button class="secondary" onclick="toggle()">▶ Auto tour</button>
</div>
<div id="status">Stop 1 of 7 · Use the buttons to travel through New York.</div>
<script>
const stops=[
["🌆","Welcome to New York!","Welcome to the city that never sleeps. Our yellow taxi is ready to take us on a journey through one of the most exciting cities in the world."],
["🗽","The Statue of Liberty","The Statue of Liberty was a gift from France in 1886. It has become a symbol of freedom and hope for people around the world."],
["🏙️","The Empire State Building","This famous skyscraper was completed in 1931. For many years, it was the tallest building in the world."],
["🌉","Brooklyn Bridge","The Brooklyn Bridge opened in 1883. It connects Manhattan and Brooklyn and offers beautiful views of the city."],
["🌳","Central Park","Central Park is a huge green space in the middle of Manhattan. New Yorkers come here to relax, exercise and enjoy nature."],
["💡","Times Square","Times Square is famous for its giant digital screens, bright lights and busy atmosphere. It is especially exciting at night."],
["👋","Goodbye, New York!","What an amazing journey! We have seen some of New York's most famous landmarks. Thanks for riding with us. See you next time!"]
];
let index=0,timer=null;
function show(){
document.getElementById("landmark").textContent=stops[index][0];
document.getElementById("caption").textContent=stops[index][1];
document.getElementById("sub").textContent=stops[index][2];
document.getElementById("status").textContent="Stop "+(index+1)+" of "+stops.length;
if(index===stops.length-1){document.getElementById("status").textContent+=" · Beep beep! 👋";}
}
function next(){index=(index+1)%stops.length;show();}
function previous(){index=(index-1+stops.length)%stops.length;show();}
function toggle(){
if(timer){clearInterval(timer);timer=null;return;}
timer=setInterval(()=>{if(index===stops.length-1){clearInterval(timer);timer=null;return;}next();},12000);
}
show();
</script>
</body>
</html>
